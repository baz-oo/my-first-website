<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baz-oo | My Personal Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080f1e;
            color: #ffffff;
            line-height: 1.8;
        }

        header {
            background: #101c30;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #164e63;
        }

        .logo {
            color: #00d4ff;
            font-size: 30px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #00d4ff;
        }

        .language-button {
            background: #00d4ff;
            color: #08111f;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background: linear-gradient(135deg, #101c30, #082b3b);
        }

        .hero h1 {
            font-size: 42px;
            color: #00d4ff;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 19px;
            color: #cbd5e1;
            max-width: 650px;
            margin: auto;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            background: #00d4ff;
            color: #08111f;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        section {
            padding: 65px 20px;
            text-align: center;
        }

        section h2 {
            color: #00d4ff;
            font-size: 30px;
            margin-bottom: 25px;
        }

        .card-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: #14243a;
            border: 1px solid #1e4058;
            padding: 25px;
            border-radius: 14px;
            width: 300px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
            border-color: #00d4ff;
        }

        .card h3 {
            color: #00d4ff;
            margin-bottom: 12px;
        }

        .card p {
            color: #cbd5e1;
        }

        footer {
            background: #101c30;
            text-align: center;
            padding: 25px;
            color: #94a3b8;
            border-top: 1px solid #164e63;
        }

        @media (max-width: 650px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                justify-content: center;
            }

            .hero h1 {
                font-size: 30px;
            }

            .card {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>

<body>

        <div class="logo">Baz-oo</div>
