<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baz-oo | موقعي الشخصي</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: white;
            line-height: 1.8;
        }

        header {
            background: #111c32;
            padding: 22px;
            text-align: center;
            border-bottom: 2px solid #00bcd4;
        }

        header h1 {
            color: #00d4ff;
            font-size: 38px;
        }

        nav {
            margin-top: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        nav a:hover {
            color: #00d4ff;
        }

        .hero {
            text-align: center;
            padding: 75px 20px;
        }

        .hero h2 {
            font-size: 32px;
            color: #00d4ff;
            margin-bottom: 15px;
        }

        .hero p {
            color: #cbd5e1;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            background: #00bcd4;
            color: #07111f;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        section {
            padding: 40px 20px;
            text-align: center;
        }

        section h2 {
            color: #00d4ff;
            margin-bottom: 20px;
        }

        .card {
            background: #16243b;
            padding: 25px;
            margin: 15px auto;
            max-width: 550px;
            border-radius: 12px;
        }

        footer {
            background: #111c32;
            text-align: center;
            padding: 20px;
            color: #94a3b8;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>Baz-oo</h1>
    <nav>
        <a href="#home">الرئيسية</a>
        <a href="#about">من أنا</a>
        <a href="#interests">اهتماماتي</a>
